# The production shape of the metering stack. Grey boxes on the use-case page
# are the three services a customer already runs: Kafka, Postgres and a blob
# store (RustFS here). Blue boxes are SQLFlow, one binary with one config per
# role; Tasks 2 to 5 add them below. docker-compose.demo.yml adds the demo's
# second count worker and the console.
services:
  kafka:
    image: confluentinc/confluent-local:7.5.0
    environment:
      # Six partitions for every auto-created topic, so usage.events splits
      # 3/3 across two count workers. One broker: see the README's note on
      # replication.
      KAFKA_NUM_PARTITIONS: "6"
      # Two listeners: PLAINTEXT for the compose network, where the broker
      # is "kafka", and PLAINTEXT_HOST for clients on the host (the tests),
      # advertised as localhost on the published port.
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports: ["${KAFKA_HOST_PORT:-29092}:29092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    volumes:
      # Applied once, on first start, in filename order.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports: ["${PG_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for the raw archive. RustFS stands in for
  # the blob store a customer already has; the configs speak plain S3.
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports: ["${S3_HOST_PORT:-9000}:9000", "${S3_CONSOLE_HOST_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the bucket the archive writes to, then exits. A PUT on the
  # bucket is idempotent: 200 whether it was created or already there.
  rustfs-init:
    image: curlimages/curl:8.16.0
    depends_on:
      rustfs: {condition: service_healthy}
    command: >
      curl -sf --aws-sigv4 aws:amz:us-east-1:s3 --user rustfsadmin:rustfsadmin
           -X PUT http://rustfs:9000/usage -o /dev/null
